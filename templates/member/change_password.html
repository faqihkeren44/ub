<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/pages/member/change_password.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/components/hero.css') }}">
</head>

<body>
    <main>
        <section class="section-container">
            <div class="hero-logo-wrapper">
                <img src="{{ url_for('static', path='img/logo_1.png') }}" alt="Logo Koperasi UB" class="hero-logo">
            </div>

            <h2>Ubah Password</h2>

            <form method="post" action="/users/change-password">
                {% if pesan %}
                    <div style="
                        padding: 15px; 
                        margin-bottom: 20px; 
                        border-radius: 4px;
                        {% if status == 'sukses' %}
                            background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;
                        {% else %}
                            background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba;
                        {% endif %}
                    ">
                        {{ pesan }}
                    </div>
                {% endif %}

                <div class="form-group">
                    <label>Password Lama</label>
                    <input type="password" name="current_password" required>
                </div>

                <div class="form-group">
                    <label>Password Baru</label>
                    <input type="password" name="new_password" required>
                </div>

                <div class="form-group">
                    <label>Konfirmasi Password Baru</label>
                    <input type="password" name="confirm_password" required>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">
                        Ganti Password
                    </button>

                    <a href="/dashboard/me">
                        <button type="button" class="btn-primary">Keluar</button>
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
