<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../static/css/pages/login.css">
</head>
<body>
    <main class="login-page">
        <div class="hero-bg-gradient"></div>

        <div class="container">
            <div class="login-card">
                <div class="login-header">
                    <h2>Masuk ke Akun Anda</h2>
                    <p>Silakan masukkan detail akun Koperasi UB Mandiri Sejahtera Anda.</p>
                </div>

                {% if pesan %}
                    <div style="
                        padding: 15px; 
                        margin-bottom: 20px; 
                        border-radius: 4px;
                        {% if status == 'sukses' %}
                            background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;
                        {% else %}
                            background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba;
                        {% endif %}
                    ">
                        {{ pesan }}
                    </div>
                {% endif %}

                <form action="/auth/login" method="post" class="login-form">
                    <div class="form-group">
                        <label for="email">Alamat Email</label>
                        <input type="text" id="username" name="username" placeholder="Masukkan NIK / ID Anggota" required>
                    </div>
                    
                    <div class="form-group">
                        <div class="label-wrapper">
                            <label for="password">Kata Sandi</label>
                            <a href="#" class="forgot-link" onclick="alertBelumTersedia()">Lupa kata sandi?</a>
                        </div>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-full">Masuk</button>
                </form>
                
                <div class="login-footer">
                    <p>Belum punya akun? <a href="/users/register">Daftar sekarang</a></p>
                </div>
            </div>
        </div>
    </main>

    <script>
        function alertBelumTersedia() {
            alert("Mohon maaf, fitur ini belum tersedia. Silakan hubungi admin.");
        }
    </script>
</body>
</html>
