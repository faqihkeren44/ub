<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/pages/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/layouts/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/components/buttons.css') }}">
</head>
<body>
    <main>
        <div class="login-container">
            <div class="logo-wrapper">
                <a href="/">
                    <img src="{{ url_for('static', path='img/logo_1.png') }}" alt="Logo Koperasi">
                </a>
            </div>

            <h2>Masuk ke Akun Anda</h2>
            <p>Silakan masukkan nomor anggota dan password akun Koperasi UB Mandiri Sejahtera Anda.</p>

            {% if pesan %}
                <div></div>
            {% endif %}

            <form action="/auth/login" method="post">
                <div>
                    <label for="member_id">ID Anggota</label>
                    <input type="text" id="username" name="username" placeholder="Masukkan ID Anggota" required>
                </div>

                <div>
                    <label for="password">Kata Sandi</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Masuk</button>
            </form>

                <div class="login-footer">
                    <p>Belum punya akun? <a href="/users/praregister">Daftar sekarang</a></p>
                </div>
        </div>
    </main>
</body>
</html>
