<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Anggota - {{ user.full_name }}</title>
    <link rel="stylesheet" href="../static/css/pages/index.css">
    <link rel="stylesheet" href="../static/css/pages/login.css"> 
    <link rel="stylesheet" href="{{ url_for('static', path='/css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/components.css') }}">
    <style>
        .profile-card {
            background: white;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-top: -50px;
            position: relative;
            z-index: 5;
        }
        .user-avatar {
            width: 100px;
            height: 100px;
            background: var(--stripe-purple);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            font-weight: 800;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div style="height: 250px; background: linear-gradient(150deg, var(--stripe-purple), var(--stripe-blue));"></div>

    <div class="container">
        <div class="profile-card">
            <div class="user-avatar">
                {{ user.full_name[0] }} </div>
            <h1>Halo, {{ user.full_name }}!</h1>
            <p style="color: #6e6e73; margin-bottom: 30px;">Anggota Aktif Koperasi Desa</p>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="stat-item">
                    <label style="font-size: 12px; color: #86868b; text-transform: uppercase;">Email Terdaftar</label>
                    <p style="font-size: 18px; font-weight: 600;">{{ user.email }}</p>
                </div>
                <div class="stat-item">
                    <label style="font-size: 12px; color: #86868b; text-transform: uppercase;">ID Anggota</label>
                    <p style="font-size: 18px; font-weight: 600;">#KOP-{{ user.id }}</p>
                </div>
            </div>

            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #d2d2d7;">
            
            <div class="actions">
                <a href="/shop" class="btn btn-dark">Mulai Belanja</a>
                <a href="/auth/login" style="color: #ff3b30; text-decoration: none; margin-left: 20px; font-weight: 600;">Keluar</a>
            </div>
        </div>
    </div>
</body>
</html>
