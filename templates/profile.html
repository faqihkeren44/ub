<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Anggota - {{ user.full_name }}</title>
    <link rel="stylesheet" href="../static/css/pages/profile.css">
</head>
<body>
    <div style="height: 250px; background: linear-gradient(150deg, var(--stripe-purple), var(--stripe-blue));"></div>

    <div class="container">
        <div class="profile-card">
            <div class="user-avatar">
                {{ user.full_name[0] }} </div>
            <h1>Halo, {{ user.full_name }}!</h1>
            <p style="color: #6e6e73; margin-bottom: 30px;">Anggota Aktif Koperasi</p>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="stat-item">
                    <label style="font-size: 12px; color: #86868b; text-transform: uppercase;">Email Terdaftar</label>
                    <p style="font-size: 18px; font-weight: 600;">{{ user.identity_numebr }}</p>
                </div>
                <div class="stat-item">
                    <label style="font-size: 12px; color: #86868b; text-transform: uppercase;">ID Anggota</label>
                    <p style="font-size: 18px; font-weight: 600;">#KOP-{{ user.member_id }}</p>
                </div>
            </div>

            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #d2d2d7;">
            
            <div class="actions">
                <a href="/users/change-password" class="btn btn-dark">Edit Profil</a>                
                <a href="/shop" class="btn btn-dark">Mulai Belanja</a>
                <a href="/auth/logout" style="color: #ff3b30; text-decoration: none; margin-left: 20px; font-weight: 600;">Keluar</a>
            </div>
        </div>
    </div>
</body>
</html>
