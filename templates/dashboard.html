<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Anggota - {{ member.full_name }}</title>
    <link rel="stylesheet" href="../static/css/pages/profile.css">
    <link rel="stylesheet" href="../static/css/pages/admin_member_detail.css">
</head>
<body>
    <div style="height: 250px; background: linear-gradient(150deg, var(--stripe-purple), var(--stripe-blue));"></div>
    
    <div class="container">
        <div class="profile-card">
            <div style="display: flex; justify-content: center; width: 100%; margin-bottom: 20px;">
                <img src="../static/img/logo_1.png" alt="Logo Koperasi" class="profile-logo" style="padding: 0; max-height: 180px; object-fit: contain;">
            </div>
            
            <div style="width: 50%; aspect-ratio: 1 / 1; overflow: hidden">
                {% if photo_url %}
                <img
                    src="{{ photo_url }}"
                    style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;"
                >
                {% else %}
                <img src="/static/img/default-user.png">
                {%endif%}
            </div>

            <div class="">
                <h3>Assalamualaikum,</h3>
                <h3>{{ member.full_name }}</h3>
                <p style="color: #6e6e73; margin-bottom: 30px;">Anggota Aktif Koperasi</p>
            </div>

            <div>
                <div class="stat-item">
                    <label style="font-size: 12px; color: #86868b; text-transform: uppercase;">ID Anggota</label>
                    <p style="font-size: 18px; font-weight: 600;">{{ member.member_id }}</p>
                </div>
            </div>

            <form
                method="POST"
                enctype="multipart/form-data"
                action="/dashboard/profile/photo">

                <input
                    type="file"
                    name="photo"
                    accept=".jpg,.jpeg,.png">

                <button class="btn btn-primary">

                    Simpan Foto

                </button>

            </form>            

            <hr style="margin: 30px 0; border: 0; border-top: 1px solid #d2d2d7;">
            
            <div class="actions">
                <a href="/dashboard/profile" class="btn btn-dark">Profile</a>
                <a href="/users/change-password" class="btn btn-dark">Ubah Password</a>              
                <a href="/auth/logout" style="color: #ff3b30; text-decoration: none; margin-left: 20px; font-weight: 600;">Keluar</a>
            </div>
        </div>
    </div>
</body>
</html>
