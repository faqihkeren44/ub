<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profil</title>
    <link rel="stylesheet" href="../static/css/pages/change_password.css">
</head>

<body>
    <div class="password-container">
        <h2>Edit Profil</h2>

        <form method="POST" action="/dashboard/edit-profile" class="password-form">

            {% if pesan %}
                <div style="
                    padding:15px;
                    margin-bottom:20px;
                    border-radius:4px;
                    {% if status == 'sukses' %}
                        background:#d4edda;
                        color:#155724;
                        border:1px solid #c3e6cb;
                    {% else %}
                        background:#fff3cd;
                        color:#856404;
                        border:1px solid #ffeeba;
                    {% endif %}
                ">
                    {{ pesan }}
                </div>
            {% endif %}

            <div class="form-group">
                <label>Nama Lengkap</label>
                <input
                    type="text"
                    name="full_name"
                    value="{{ member.full_name }}"
                    required>
            </div>

            <div class="form-group">
                <label>Nomor KTP (NIK)</label>
                <input
                    type="text"
                    name="identity_number"
                    value="{{ member.identity_number }}"
                    required>
            </div>

            <div class="form-group">
                <label>Nomor Kartu Keluarga</label>
                <input
                    type="text"
                    name="family_card_number"
                    value="{{ member.family_card_number }}"
                    required>
            </div>

            <div class="form-group">
                <label>Tempat Lahir</label>
                <input
                    type="text"
                    name="birth_place"
                    value="{{ member.birth_place }}"
                    required>
            </div>

            <div class="form-group">
                <label>Tanggal Lahir</label>
                <input
                    type="date"
                    name="birth_date"
                    value="{{ member.birth_date }}"
                    required>
            </div>

            <div class="form-group">
                <label>Jenis Kelamin</label>
                <select name="gender" required>
                    <option value="Pria"
                        {% if member.gender == "Pria" %}selected{% endif %}>
                        Pria
                    </option>

                    <option value="Wanita"
                        {% if member.gender == "Wanita" %}selected{% endif %}>
                        Wanita
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label>Alamat</label>
                <textarea
                    name="address"
                    rows="3"
                    required>{{ member.address }}</textarea>
            </div>

            <div class="form-group">
                <label>Nomor HP / WhatsApp</label>
                <input
                    type="text"
                    name="phone_number"
                    value="{{ member.phone_number }}"
                    required>
            </div>

            <div class="form-group">
                <label>Nama Suami / Istri</label>
                <input
                    type="text"
                    name="spouse_name"
                    value="{{ member.spouse_name or '' }}">
            </div>

            <div class="form-group">
                <label>Pekerjaan</label>
                <input
                    type="text"
                    name="job"
                    value="{{ member.job }}"
                    required>
            </div>

            <div class="form-group">
                <label>Kelompok DKM</label>                
                <select id="dkm_group" name="dkm_group" required value="{{ member.dkm_group.value }}">
                    <option value="DKM DARUSSALAM - Gunung Gede">DKM DARUSSALAM - Gunung Gede</option>
                    <option value="DKM AL BAROKAH - Pondok Rumput">DKM AL BAROKAH - Pondok Rumput</option>
                    <option value="DKM DARUL HIKMAH - Green Arofah">DKM DARUL HIKMAH - Green Arofah</option>
                    <option value="DKM AR-RAUDHOH - Pakuan">DKM AR-RAUDHOH - Pakuan</option>
                    <option value="DKM BAITUL IZZA - Tajur">DKM BAITUL IZZA - Tajur</option>
                    <option value="DKM AN-NASHR - Cikaret">DKM AN-NASHR - Cikaret</option>
                    <option value="DKM AR-ROHMAN - Ciapus">DKM AR-ROHMAN - Ciapus</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Simpanan Wajib</label>
                <select id="mandatory_savings" name="mandatory_savings" required value="Rp {{ '{:,.0f}'.format(member.mandatory_savings|int).replace(',', '.') }}">
                    <option value="25000">Rp 25.000</option>
                    <option value="50000">Rp 50.000</option>
                    <option value="100000">Rp 100.000</option>
                    <option value="250000">Rp 250.000</option>
                    <option value="500000">Rp 500.000</option>
                </select>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">
                    Simpan Perubahan
                </button>

                <a href="/dashboard/profile" class="btn-back">Kembali</a>
            </div>
        </form>
    </div>
</body>
</html>
